<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MyChat</title>
    <style>
        body {
          font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
          background: #f4f6f9;
          margin: 0;
          display: flex;
          flex-direction: column;
          height: 100vh;
        }
        header {
          background: #0d47a1;
          color: white;
          padding: 15px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        #chatWindow {
          flex: 1;
          padding: 20px;
          overflow-y: auto;
          background: #fff;
          border-top: 1px solid #ddd;
          border-bottom: 1px solid #ddd;
        }
        .message {
          margin: 10px 0;
          padding: 10px 15px;
          border-radius: 8px;
          max-width: 70%;
          box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .sent {
          background: #e3f2fd;
          align-self: flex-end;
          margin-left: auto;
        }
        .received {
          background: #c8e6c9;
          align-self: flex-start;
          margin-right: auto;
        }
        .meta {
          font-size: 0.8em;
          color: #555;
          margin-top: 5px;
        }
        #inputPanel {
          display: flex;
          padding: 15px;
          background: #fafafa;
          border-top: 1px solid #ddd;
        }
        #inputPanel input, #inputPanel button {
          margin-right: 10px;
          padding: 10px;
          border-radius: 5px;
          border: 1px solid #ccc;
        }
        #inputPanel button {
          background: #0d47a1;
          color: white;
          border: none;
          cursor: pointer;
        }
        #inputPanel button:hover {
          background: #1565c0;
        }
    </style>
</head>
<body>
<header>
    <h2>MyChat</h2>
    <span id="status">🔴 Disconnected</span>
</header>

<div id="chatWindow"></div>

<div id="inputPanel">
    <input id="sender" placeholder="Your name" />
    <input id="message" placeholder="Type a message..." style="flex:1;" />
    <button onclick="sendMessage()">Send</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    let stompClient = null;

    function connect() {
      const socket = new SockJS('/ws');
      stompClient = Stomp.over(socket);
      stompClient.connect({}, () => {
        document.getElementById("status").textContent = "🟢 Connected";
        stompClient.subscribe('/topic/messages', (msg) => {
          const body = JSON.parse(msg.body);
          showMessage(body.sender, body.content, body.sentAt, "received");
        });
      });
    }

    function sendMessage() {
      const sender = document.getElementById("sender").value;
      const content = document.getElementById("message").value;
      if (stompClient && sender && content) {
        const chatRequest = { sender, content };
        stompClient.send("/app/chat", {}, JSON.stringify(chatRequest));
        showMessage(sender, content, new Date().toISOString(), "sent");
        document.getElementById("message").value = "";
      }
    }

    function showMessage(sender, content, time, type) {
      const chatWindow = document.getElementById("chatWindow");
      const div = document.createElement("div");
      div.className = "message " + type;
      div.innerHTML = `<strong>${sender}</strong><br>${content}<div class="meta">${new Date(time).toLocaleTimeString()}</div>`;
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    connect();
</script>
</body>
</html>
